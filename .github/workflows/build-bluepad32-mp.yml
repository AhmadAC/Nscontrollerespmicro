name: Build Bluepad32 MicroPython Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    
    # Run the job inside an official ESP-IDF Docker container
    container: espressif/idf:release-v5.5
    
    steps:
      - name: Checkout Nscontrollerespmicro Source (This Repo)
        uses: actions/checkout@v4

      - name: Checkout MicroPython Source
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          path: micropython
          submodules: true

      - name: Checkout Bluepad32 Library
        uses: actions/checkout@v4
        with:
          repository: ricardoquesada/bluepad32
          path: bluepad32

      - name: Prepare MicroPython mpy-cross
        run: |
          cd micropython
          make -C mpy-cross 

      - name: Compile ESP32 Firmware
        run: |
          # Source the export script so idf.py is loaded
          . $IDF_PATH/export.sh
          
          cd micropython/ports/esp32
          
          # Set target to generic ESP32
          idf.py set-target esp32
          
          # Compile! 
          # - EXTRA_COMPONENT_DIRS compiles the raw Bluepad32 library
          # - USER_C_MODULES compiles your custom Python bindings
          idf.py build \
            -DEXTRA_COMPONENT_DIRS=$GITHUB_WORKSPACE/bluepad32 \
            -DUSER_C_MODULES=$GITHUB_WORKSPACE/modbluepad32
          
          echo "🚀 Compilation finished!"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluepad32-MicroPython-ESP32-WROOM
          path: micropython/ports/esp32/build/firmware.bin
          retention-days: 7
