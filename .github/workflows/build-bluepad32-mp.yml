name: Build Bluepad32 MicroPython Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    
    # MicroPython v1.23 officially supports ESP-IDF v5.2.2
    container: espressif/idf:v5.2.2
    
    steps:
      - name: Checkout Nscontrollerespmicro Source
        uses: actions/checkout@v4

      - name: Checkout MicroPython Source
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: v1.23.0
          path: micropython
          submodules: recursive

      - name: Checkout Bluepad32 Library
        uses: actions/checkout@v4
        with:
          repository: ricardoquesada/bluepad32
          path: bluepad32
          submodules: recursive # CRITICAL: BTStack contains nested submodules in its 3rd-party/ directory

      - name: Adapt Bluepad32 CMake for ESP-IDF v5.2 Compatibility
        run: |
          # Replace 'esp_driver_gpio' (introduced in ESP-IDF v5.3) with 'driver' for compatibility with v5.2.2
          find bluepad32 -name "CMakeLists.txt" -type f -exec sed -i 's/esp_driver_gpio/driver/g' {} +

      - name: Fix BTStack Warnings & Inject Configuration
        run: |
          sed -i 's/uint16_t uuid;/uint16_t uuid = 0;/g' bluepad32/external/btstack/src/classic/avdtp.c
          echo "component_compile_options(-Wno-error)" >> bluepad32/external/btstack/port/esp32/components/btstack/CMakeLists.txt
          
          # Inject btstack_config.h into the main btstack src directory so it is globally available to QSTR and ESP-IDF
          BTSTACK_CONF=$(find bluepad32 -name "btstack_config.h" | grep -i esp32 | head -n 1)
          if [ -z "$BTSTACK_CONF" ]; then
            # Fallback if grep esp32 fails
            BTSTACK_CONF=$(find bluepad32 -name "btstack_config.h" | head -n 1)
          fi
          
          if [ -n "$BTSTACK_CONF" ]; then
            echo "Copying btstack_config.h from $BTSTACK_CONF"
            cp "$BTSTACK_CONF" bluepad32/external/btstack/src/
          else
            echo "Error: Could not find any btstack_config.h!"
            exit 1
          fi

      - name: Configure MicroPython to Use Bluepad32 (Disable NimBLE)
        run: |
          # 1. Disable native MicroPython Bluetooth to prevent hardware conflict
          echo "#undef MICROPY_PY_BLUETOOTH" >> micropython/ports/esp32/boards/ESP32_GENERIC/mpconfigboard.h
          echo "#define MICROPY_PY_BLUETOOTH (0)" >> micropython/ports/esp32/boards/ESP32_GENERIC/mpconfigboard.h
          
          # 2. Inject Bluepad32 / BTStack config requirements
          cat <<EOF >> micropython/ports/esp32/boards/ESP32_GENERIC/sdkconfig.board
          
          CONFIG_BT_NIMBLE_ENABLED=n
          CONFIG_BT_BLUEDROID_ENABLED=n
          CONFIG_BT_ENABLED=y
          CONFIG_BT_CONTROLLER_ONLY=y
          CONFIG_BT_STANDARD_HCI=y
          CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
          CONFIG_BT_BTU_TASK_STACK_SIZE=8192
          EOF
          
          # 3. Force ESP-IDF to discover AND link Bluepad32 and BTStack
          sed -i "2i list(APPEND EXTRA_COMPONENT_DIRS \"$GITHUB_WORKSPACE/bluepad32/src/components\" \"$GITHUB_WORKSPACE/bluepad32/external/btstack/port/esp32/components\")" micropython/ports/esp32/CMakeLists.txt
          sed -i 's/REQUIRES/REQUIRES bluepad32 btstack /g' micropython/ports/esp32/main_esp32/CMakeLists.txt

      - name: Prepare MicroPython mpy-cross
        run: |
          make -C micropython/mpy-cross 

      - name: Compile ESP32 Firmware
        run: |
          . $IDF_PATH/export.sh
          cd micropython/ports/esp32
          
          make BOARD=ESP32_GENERIC submodules
          
          export USER_C_MODULES=$GITHUB_WORKSPACE/modbluepad32/micropython.cmake
          
          make BOARD=ESP32_GENERIC USER_C_MODULES=$USER_C_MODULES
          
          echo "🚀 Compilation finished!"

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bluepad32-MicroPython-ESP32-WROOM
          path: |
            micropython/ports/esp32/build-ESP32_GENERIC/*.bin
            micropython/ports/esp32/build-ESP32_GENERIC/bootloader/*.bin
            micropython/ports/esp32/build-ESP32_GENERIC/partition_table/*.bin
          retention-days: 7