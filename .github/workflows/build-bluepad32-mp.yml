name: Build Bluepad32 MicroPython Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    
    # Run the job inside an official ESP-IDF Docker container
    container: espressif/idf:release-v5.5
    
    steps:
      # Step 1: Crucial step to checkout your own repository (Nscontrollerespmicro)
      # This brings your custom micropython.cmake and C/C++ module files into the runner
      - name: Checkout Nscontrollerespmicro Source (This Repo)
        uses: actions/checkout@v4

      # Step 2: Checkout the official MicroPython repository
      - name: Checkout MicroPython Source
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          path: micropython
          submodules: true # Essential for fetching MicroPython dependencies

      # Step 3: Checkout Bluepad32 Library (to compile alongside)
      - name: Checkout Bluepad32 Library
        uses: actions/checkout@v4
        with:
          repository: ricardoquesada/bluepad32
          path: bluepad32

      - name: Inject Bluepad32 into MicroPython
        run: |
          cd micropython
          # Compile the mpy-cross compiler first (required for building MP modules)
          make -C mpy-cross 
          
          # Create directory for external C modules in the ESP32 port
          mkdir -p ports/esp32/modules/bluepad32
          
          # Copy Bluepad32 source files into the MicroPython tree
          cp -r ../bluepad32/src/* ports/esp32/modules/bluepad32/
          
          echo "✅ Bluepad32 injected successfully."

      - name: Compile ESP32 Firmware
        run: |
          # Source the export script so idf.py is loaded in this shell session
          . $IDF_PATH/export.sh
          
          # Verify the environment is working
          idf.py --version
          
          cd micropython/ports/esp32
          
          # Set target to generic ESP32 (supports WROOM)
          idf.py set-target esp32
          
          # Build firmware, injecting the custom C module from your repository.
          # Note: If micropython.cmake is in the root of your repository, point directly to $GITHUB_WORKSPACE.
          # If it is inside a subdirectory, point to $GITHUB_WORKSPACE/your-subdirectory-name.
          idf.py build -DUSER_C_MODULES=$GITHUB_WORKSPACE
          
          echo "🚀 Compilation finished!"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluepad32-MicroPython-ESP32-WROOM
          path: micropython/ports/esp32/build/firmware.bin
          retention-days: 7
