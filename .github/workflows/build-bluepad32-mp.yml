name: Build Bluepad32 MicroPython Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    
    # Use the exact ESP-IDF version supported by MicroPython v1.23
    container: espressif/idf:v5.0.4
    
    steps:
      - name: Checkout Nscontrollerespmicro Source
        uses: actions/checkout@v4

      - name: Checkout MicroPython Source
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: v1.23.0
          path: micropython
          submodules: true

      - name: Checkout Bluepad32 Library
        uses: actions/checkout@v4
        with:
          repository: ricardoquesada/bluepad32
          path: bluepad32
          submodules: true

      - name: Generate BTStack Component for ESP-IDF
        run: |
          cd bluepad32/external/btstack/port/esp32
          IDF_PATH=$GITHUB_WORKSPACE/bluepad32/src python ./integrate_btstack.py

      - name: Fix BTStack Strict Compiler Warnings
        run: |
          sed -i 's/uint16_t uuid;/uint16_t uuid = 0;/g' bluepad32/src/components/btstack/src/classic/avdtp.c
          echo "component_compile_options(-Wno-error)" >> bluepad32/src/components/btstack/CMakeLists.txt

      - name: Configure MicroPython to Use Bluepad32 (Disable NimBLE)
        run: |
          # 1. Disable native MicroPython Bluetooth to prevent hardware conflict
          echo "#undef MICROPY_PY_BLUETOOTH" >> micropython/ports/esp32/boards/ESP32_GENERIC/mpconfigboard.h
          echo "#define MICROPY_PY_BLUETOOTH (0)" >> micropython/ports/esp32/boards/ESP32_GENERIC/mpconfigboard.h
          
          # 2. Inject Bluepad32 / BTStack config requirements
          cat <<EOF >> micropython/ports/esp32/boards/ESP32_GENERIC/sdkconfig.board
          
          CONFIG_BT_NIMBLE_ENABLED=n
          CONFIG_BT_BLUEDROID_ENABLED=n
          CONFIG_BT_ENABLED=y
          CONFIG_BT_CONTROLLER_ONLY=y
          CONFIG_BT_STANDARD_HCI=y
          CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
          CONFIG_BT_BTU_TASK_STACK_SIZE=8192
          EOF
          
          # 3. CRITICAL FIX: Force ESP-IDF to compile and link Bluepad32 and BTStack
          sed -i 's/REQUIRES/REQUIRES bluepad32 btstack /g' micropython/ports/esp32/main_esp32/CMakeLists.txt

      - name: Prepare MicroPython mpy-cross
        run: |
          make -C micropython/mpy-cross 

      - name: Compile ESP32 Firmware
        run: |
          . $IDF_PATH/export.sh
          cd micropython/ports/esp32
          
          make BOARD=ESP32_GENERIC submodules
          
          export EXTRA_COMPONENT_DIRS=$GITHUB_WORKSPACE/bluepad32/src/components
          export USER_C_MODULES=$GITHUB_WORKSPACE/modbluepad32/micropython.cmake
          
          make BOARD=ESP32_GENERIC USER_C_MODULES=$USER_C_MODULES EXTRA_COMPONENT_DIRS=$EXTRA_COMPONENT_DIRS
          
          echo "🚀 Compilation finished!"

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bluepad32-MicroPython-ESP32-WROOM
          path: |
            micropython/ports/esp32/build-ESP32_GENERIC/*.bin
            micropython/ports/esp32/build-ESP32_GENERIC/bootloader/*.bin
            micropython/ports/esp32/build-ESP32_GENERIC/partition_table/*.bin
          retention-days: 7
