name: Build Bluepad32 MicroPython Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    
    # Run the job inside an official ESP-IDF Docker container
    container: espressif/idf:release-v5.5
    
    steps:
      - name: Checkout Nscontrollerespmicro Source (This Repo)
        uses: actions/checkout@v4

      - name: Checkout MicroPython Source
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          path: micropython
          submodules: true

      - name: Checkout Bluepad32 Library
        uses: actions/checkout@v4
        with:
          repository: ricardoquesada/bluepad32
          path: bluepad32
          submodules: true

      - name: Generate BTStack Component for ESP-IDF
        run: |
          cd bluepad32/external/btstack/port/esp32
          # This script copies the btstack library into bluepad32/src/components/btstack
          IDF_PATH=$GITHUB_WORKSPACE/bluepad32/src python ./integrate_btstack.py

      - name: Fix BTStack Strict Compiler Warnings
        run: |
          # 1. GCC 14.2 flags 'uuid' in avdtp.c as maybe-uninitialized. 
          # We manually initialize it to 0 to satisfy the strict compiler rules.
          sed -i 's/uint16_t uuid;/uint16_t uuid = 0;/g' bluepad32/src/components/btstack/src/classic/avdtp.c
          
          # 2. Append a directive to BTStack's CMake file to prevent any other minor warnings from failing the build
          echo "component_compile_options(-Wno-error)" >> bluepad32/src/components/btstack/CMakeLists.txt

      - name: Prepare MicroPython mpy-cross
        run: |
          cd micropython
          make -C mpy-cross 

      - name: Compile ESP32 Firmware
        run: |
          # Source the export script so idf.py is loaded in this shell session
          . $IDF_PATH/export.sh
          
          cd micropython/ports/esp32
          
          # Set target to generic ESP32
          idf.py set-target esp32
          
          # Build firmware
          idf.py build \
            -DEXTRA_COMPONENT_DIRS=$GITHUB_WORKSPACE/bluepad32/src/components \
            -DUSER_C_MODULES=$GITHUB_WORKSPACE/modbluepad32
          
          echo "🚀 Compilation finished!"

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bluepad32-MicroPython-ESP32-WROOM
          # Using wildcards grabs all generated binaries, preventing missing file errors
          path: |
            micropython/ports/esp32/build/*.bin
            micropython/ports/esp32/build/bootloader/*.bin
            micropython/ports/esp32/build/partition_table/*.bin
          retention-days: 7
